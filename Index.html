<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCloud Photo Album Map</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- ExifReader for reading GPS EXIF directly from images -->
  <script src="https://cdn.jsdelivr.net/npm/exifreader@4.21.1/dist/exif-reader.js"></script>

  <style>
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1rem;
      padding: 0;
      overflow: hidden;
    }
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.9);
    }
    .custom-marker {
      transition: transform 0.2s ease;
    }
    .custom-marker:hover {
      transform: scale(1.15) translateY(-4px);
      z-index: 1000 !important;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden">

  <!-- Header / Navigation -->
  <header class="h-16 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
        <i data-lucide="map-pin" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-none">Photo Map</h1>
        <p class="text-xs text-slate-400 mt-1" id="activeAlbumLabel">iCloud Album Explorer</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Album Selector Dropdown -->
      <select id="albumSelect" onchange="switchAlbum(this.value)" class="bg-slate-800 border border-slate-700 text-sm rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 max-w-[180px] sm:max-w-[240px] truncate">
      </select>

      <!-- Manage Albums Button -->
      <button onclick="toggleModal(true)" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition flex items-center gap-2 text-sm font-medium px-3">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Album verwalten</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
    <!-- Map Container -->
    <div id="map" class="flex-1 h-full w-full bg-slate-950 z-10"></div>

    <!-- Sidebar / Photo Grid -->
    <aside class="w-full md:w-96 bg-slate-900/90 backdrop-blur-md border-t md:border-t-0 md:border-l border-slate-800 flex flex-col z-20 max-h-[40vh] md:max-h-full">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <span class="text-sm font-semibold text-slate-300" id="photoCount">0 Fotos auf der Karte</span>
        <button onclick="fitAllMarkers()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
          <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i> Alle zeigen
        </button>
      </div>
      <div id="photoList" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-3">
        <!-- Photo Cards populated by JS -->
      </div>
    </aside>
  </div>

  <!-- Modal: Album Manager -->
  <div id="albumModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i data-lucide="link" class="w-5 h-5 text-indigo-400"></i> iCloud Album hinzufügen
        </h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form onsubmit="addAlbum(event)" class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Name des Albums / der Reise</label>
          <input type="text" id="albumNameInput" required placeholder="z. B. Toskana Bikepacking 2026" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">iCloud-Freigabelink</label>
          <input type="url" id="albumUrlInput" required placeholder="https://photos.icloud.com/shared/album/..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-sm">
          Album speichern & laden
        </button>
      </form>

      <div class="border-t border-slate-800 pt-4">
        <h4 class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Gespeicherte Alben</h4>
        <div id="savedAlbumsList" class="space-y-2 max-h-40 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Map Setup
    const map = L.map('map', { zoomControl: false }).setView([43.4000, 10.8600], 8);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let activeAlbums = JSON.parse(localStorage.getItem('icloud_albums')) || [
      { id: 'default', name: 'Standard Album', url: 'https://photos.icloud.com/shared/album/0d4DglBcEyGpc1-neZKrAwEJgP' }
    ];

    function saveAlbums() {
      localStorage.setItem('icloud_albums', JSON.stringify(activeAlbums));
    }

    function toggleModal(show) {
      document.getElementById('albumModal').classList.toggle('hidden', !show);
      if(show) renderSavedAlbumsList();
    }

    function renderSavedAlbumsList() {
      const container = document.getElementById('savedAlbumsList');
      container.innerHTML = activeAlbums.map((album, idx) => `
        <div class="flex items-center justify-between p-2.5 bg-slate-800/60 rounded-xl text-sm border border-slate-700/50">
          <span class="font-medium truncate max-w-[220px]">${album.name}</span>
          <button onclick="removeAlbum(${idx})" class="text-rose-400 hover:text-rose-300 p-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function updateAlbumDropdown() {
      const select = document.getElementById('albumSelect');
      select.innerHTML = activeAlbums.map((album, idx) => `
        <option value="${idx}">${album.name}</option>
      `).join('');
    }

    function addAlbum(e) {
      e.preventDefault();
      const name = document.getElementById('albumNameInput').value;
      const url = document.getElementById('albumUrlInput').value;
      
      activeAlbums.push({ id: Date.now().toString(), name, url });
      saveAlbums();
      updateAlbumDropdown();
      switchAlbum(activeAlbums.length - 1);
      toggleModal(false);
      document.getElementById('albumNameInput').value = '';
      document.getElementById('albumUrlInput').value = '';
    }

    function removeAlbum(idx) {
      if(activeAlbums.length <= 1) return alert('Du musst mindestens ein Album behalten.');
      activeAlbums.splice(idx, 1);
      saveAlbums();
      updateAlbumDropdown();
      renderSavedAlbumsList();
      switchAlbum(0);
    }

    function switchAlbum(index) {
      const album = activeAlbums[index];
      document.getElementById('activeAlbumLabel').innerText = album.name;
      loadAlbumData(album.url);
    }

    // Mock Data Generator for demonstration if live fetching isn't available
    function loadAlbumData(url) {
      markersLayer.clearLayers();
      
      // Sample coordinates for visualization
      const samplePhotos = [
        { lat: 43.4000, lng: 10.8600, title: "Volterra Panorama", url: "https://images.unsplash.com/photo-1541370976299-4d24ebbc9077?w=500" },
        { lat: 43.5485, lng: 10.3106, title: "Livorno Küste", url: "https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=500" },
        { lat: 43.3188, lng: 11.3307, title: "Siena Platz", url: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500" }
      ];

      const bounds = L.latLngBounds();
      const photoList = document.getElementById('photoList');
      photoList.innerHTML = '';

      samplePhotos.forEach((photo, idx) => {
        bounds.extend([photo.lat, photo.lng]);

        // Custom Marker
        const icon = L.divIcon({
          className: 'custom-marker',
          html: `<div class="w-10 h-10 rounded-full border-2 border-indigo-500 overflow-hidden shadow-lg bg-slate-900">
                  <img src="${photo.url}" class="w-full h-full object-cover">
                 </div>`,
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        });

        const marker = L.marker([photo.lat, photo.lng], { icon })
          .bindPopup(`
            <div class="p-2 w-48">
              <img src="${photo.url}" class="w-full h-28 object-cover rounded-lg mb-2">
              <h4 class="font-bold text-sm text-slate-100">${photo.title}</h4>
              <p class="text-xs text-slate-400 mt-1">${photo.lat.toFixed(4)}, ${photo.lng.toFixed(4)}</p>
            </div>
          `);

        markersLayer.addLayer(marker);

        // Sidebar Card
        photoList.innerHTML += `
          <div onclick="focusMarker(${photo.lat}, ${photo.lng})" class="cursor-pointer bg-slate-800/50 hover:bg-slate-800 rounded-xl overflow-hidden border border-slate-700/50 transition group">
            <div class="h-24 overflow-hidden">
              <img src="${photo.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            </div>
            <div class="p-2">
              <p class="text-xs font-semibold truncate text-slate-200">${photo.title}</p>
            </div>
          </div>
        `;
      });

      document.getElementById('photoCount').innerText = `${samplePhotos.length} Fotos geladen`;
      map.fitBounds(bounds, { padding: [50, 50] });
    }

    function focusMarker(lat, lng) {
      map.flyTo([lat, lng], 13, { duration: 1.2 });
    }

    function fitAllMarkers() {
      if(markersLayer.getLayers().length > 0) {
        const group = new L.featureGroup(markersLayer.getLayers());
        map.fitBounds(group.getBounds(), { padding: [50, 50] });
      }
    }

    // Initialize
    updateAlbumDropdown();
    switchAlbum(0);
  </script>
</body>
</html>
